name: B - 02 - artifacts

on:
  workflow_dispatch:

env:
  build-artifact-key: app-${{ github.sha }}
  test-report-key: test-coverage-${{ github.sha }}
  working-directory: simple-crm

defaults:
  run:
    working-directory: simple-crm

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node et PNPM dependencies
        uses: ./.github/actions/composite-cache-deps
        with:
          node-version: 26.x
          pnpm-version: 12.x
          working-dir: ${{ env.working-directory }}
      - name: Linting
        run: pnpm lint
      - name: Test
        run: pnpm test:coverage
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.test-report-key }}
          path: ${{ env.working-directory }}/coverage
          if-no-files-found: warn
  build:
    runs-on: ubuntu-latest
    needs:
      - lint-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node et PNPM dependencies
        uses: ./.github/actions/composite-cache-deps
        with:
          node-version: 26.x
          pnpm-version: 12.x
          working-dir: ${{ env.working-directory }}
      - name: Building
        run: pnpm build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.build-artifact-key }}
          path: ${{ env.working-directory }}/dist
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
    defaults:
      run:
        working-directory: simple-crm/dist
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.build-artifact-key }}
          path: ${{ env.working-directory }}/dist

      - name: Output contents
        run: ls -la

      - name: Deploy
        run: echo "Deploying..."
