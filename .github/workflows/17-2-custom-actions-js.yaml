name: 17 - 2 - Custom Actions - JS
run-name: 17 -2 - Customs Actions - JS | BB - ${{ inputs.base-branch}} TB - ${{ inputs.target-branch}} WD - ${{ inputs.working-directory}} | BB - ${{ github.event.inputs.base-branch}} TB - ${{ github.event.inputs.target-branch}} WD - ${{ inputs.working-directory }}

on:
  workflow_dispatch:
    inputs:
      base-branch:
        type: string
        default: main
      target-branch:
        type: string
        default: update-dedpendencies
      working-directory:
        type: string
        default: 17-custom-actions/react-app

env:
  working-directory: 17-custom-actions/react-app

jobs:

  dependency-update:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.x        # react-app/package.json has no "packageManager" field, so the version is required
          run_install: false

      - name: Check for dependency update
        uses: ./.github/actions/js-dependency-update
        with:
          base-branch: ${{ inputs.base-branch }}
          target-branch: ${{ inputs.target-branch }}
          working-directory: ${{ inputs.working-directory }}
