name: C - 01 - tasks-api (env vars & secrets)

on:
  workflow_dispatch:
  push:
    paths:
      - tasks-api/**
      - .github/workflows/C-01-tasks-api.yaml

# Integration and e2e tests share the same Atlas cluster: never run two workflows at once.
concurrency:
  group: tasks-api-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level env: visible to every job and step.
env:
  working-directory: tasks-api
  PORT: 3000

defaults:
  run:
    working-directory: tasks-api

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node and pnpm dependencies
        uses: ./.github/actions/composite-cache-deps
        with:
          working-dir: ${{ env.working-directory }}
      - name: Run unit tests (no database needed)
        run: pnpm test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Job-level env: secrets and variables configured in Settings > Secrets and variables > Actions.
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || 'tasks' }}
    steps:
      - name: Check required secret
        run: |
          if [[ -z "$MONGODB_URI" ]]; then
            echo "::error::Secret MONGODB_URI is not defined (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      # GitHub masks secret values in logs: the URI line prints "***".
      - name: Show configuration
        run: |
          echo "Database name : $MONGODB_DB_NAME"
          echo "Port          : $PORT"
          echo "Mongo URI     : $MONGODB_URI"
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node and pnpm dependencies
        uses: ./.github/actions/composite-cache-deps
        with:
          working-dir: ${{ env.working-directory }}
      - name: Run integration tests against MongoDB Atlas
        run: pnpm test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      # Separate database so e2e data never mixes with the integration tests.
      MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || 'tasks' }}_e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node and pnpm dependencies
        uses: ./.github/actions/composite-cache-deps
        with:
          working-dir: ${{ env.working-directory }}
      # API-only tests use the `request` fixture: no browser download required.
      - name: Run Playwright e2e tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: ${{ env.working-directory }}/playwright-report
          if-no-files-found: warn
          retention-days: 7
